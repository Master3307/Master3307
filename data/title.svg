<svg xmlns="http://www.w3.org/2000/svg"
  width="720"
  height="112"
  viewBox="0 0 720 112"
  role="img"
  aria-labelledby="header-title">

  <title id="header-title">Ja Servus 👋 I'm MrKoby07! :D</title>

  <defs>
    <linearGradient
      id="name-shine"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%"
      spreadMethod="pad">

      <stop offset="0%" stop-color="#a566ff"/>
      <stop offset="30%" stop-color="#a566ff"/>
      <stop offset="43%" stop-color="#dc8add"/>
      <stop offset="50%" stop-color="#fff3ff"/>
      <stop offset="57%" stop-color="#dc8add"/>
      <stop offset="70%" stop-color="#a566ff"/>
      <stop offset="100%" stop-color="#a566ff"/>

      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        values="-1 0; 1 0; 1 0"
        keyTimes="0; 0.65; 1"
        begin="1.8s"
        dur="4.5s"
        repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient
      id="separator-color"
      gradientUnits="userSpaceOnUse"
      x1="16" y1="0"
      x2="704" y2="0">

      <stop offset="0%" stop-color="#8e58d4" stop-opacity="0"/>
      <stop offset="8%" stop-color="#8e58d4" stop-opacity=".55"/>
      <stop offset="35%" stop-color="#a566ff" stop-opacity=".85"/>
      <stop offset="50%" stop-color="#dc8add"/>
      <stop offset="65%" stop-color="#a566ff" stop-opacity=".85"/>
      <stop offset="92%" stop-color="#8e58d4" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#8e58d4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient
      id="comet-color"
      gradientUnits="userSpaceOnUse"
      x1="-110" y1="0"
      x2="0" y2="0">

      <stop offset="0%" stop-color="#a566ff" stop-opacity="0"/>
      <stop offset="55%" stop-color="#a566ff" stop-opacity=".35"/>
      <stop offset="85%" stop-color="#dc8add" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#fff3ff"/>
    </linearGradient>

    <path
      id="separator-track"
      pathLength="1"
      d="M16 84 H312 L324 78 H348
         L360 84 L372 78 H396 L408 84 H704"/>

    <mask
      id="track-mask"
      maskUnits="userSpaceOnUse"
      x="12"
      y="70"
      width="696"
      height="24">

      <use
        href="#separator-track"
        fill="none"
        stroke="white"
        stroke-width="2"
        stroke-linecap="round"/>
    </mask>
  </defs>

  <style>
    .greeting {
      font-family: "Segoe UI", Ubuntu, Arial, sans-serif,
                   "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 30px;
      font-weight: 400;
      fill: #e6def2;
      white-space: pre;
    }

    .greeting-left {
      text-anchor: end;
    }

    .greeting-right {
      text-anchor: start;
    }

    .hand {
      text-anchor: middle;
      font-family: "Apple Color Emoji", "Segoe UI Emoji",
                   "Noto Color Emoji", sans-serif;
    }

    .name {
      font-weight: 900;
      fill: url(#name-shine);
    }

    .static-heading {
      display: none;
    }

    .line {
      fill: none;
      stroke: url(#separator-color);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1 1;
      animation: draw-line 1.2s cubic-bezier(.65, 0, .35, 1) .65s both;
    }

    .line-glow {
      stroke-width: 6;
      opacity: .08;
    }

    .line-front {
      stroke-width: 1.4;
    }

    .comet {
      opacity: 0;
      animation: sweep 6s linear 2.1s infinite;
    }

    .star {
      animation: star-arrive .65s cubic-bezier(.34, 1.56, .64, 1) 1.4s both;
    }

    @keyframes draw-line {
      from {
        stroke-dashoffset: 1;
      }
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes star-arrive {
      from {
        transform: scale(0) rotate(-45deg);
        opacity: 0;
      }
      to {
        transform: scale(1) rotate(0);
        opacity: .85;
      }
    }

    @keyframes sweep {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      8%, 76% {
        opacity: 1;
      }
      86%, 100% {
        transform: translateX(830px);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .animated-heading {
        display: none !important;
      }

      .static-heading {
        display: inline !important;
      }

      .static-heading .name {
        fill: #a566ff;
      }

      .line,
      .star {
        animation: none;
      }

      .line {
        stroke-dasharray: none;
      }

      .star {
        opacity: .85;
      }

      .comet {
        display: none;
        animation: none;
      }
    }
  </style>

  <!-- Animated Heading -->
  <g class="animated-heading" aria-hidden="true">

    <text x="286" y="46" class="greeting greeting-left" xml:space="preserve"><tspan>J<set attributeName="visibility" to="hidden" begin="0s" dur=".100s"/></tspan><tspan>a<set attributeName="visibility" to="hidden" begin="0s" dur=".135s"/></tspan><tspan> <set attributeName="visibility" to="hidden" begin="0s" dur=".170s"/></tspan><tspan>S<set attributeName="visibility" to="hidden" begin="0s" dur=".205s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".240s"/></tspan><tspan>r<set attributeName="visibility" to="hidden" begin="0s" dur=".275s"/></tspan><tspan>v<set attributeName="visibility" to="hidden" begin="0s" dur=".310s"/></tspan><tspan>u<set attributeName="visibility" to="hidden" begin="0s" dur=".345s"/></tspan><tspan>s<set attributeName="visibility" to="hidden" begin="0s" dur=".380s"/></tspan></text>

    <!--
      Hand group: Low anchor pivot at (316, 48) near the true wrist base.
      First strong wave executes cleanly, then gives way to the gentle wave.
    -->
    <g>
      <!-- Phase 1: Strong intro wave -->
      <animateTransform
        id="intro-wave"
        attributeName="transform"
        type="rotate"
        begin=".480s"
        dur="2.4s"
        fill="freeze"
        calcMode="spline"
        keyTimes="0; 0.12; 0.28; 0.44; 0.60; 0.76; 0.90; 1"
        keySplines="
          .42 0 .58 1;
          .42 0 .58 1;
          .42 0 .58 1;
          .42 0 .58 1;
          .42 0 .58 1;
          .42 0 .58 1;
          .42 0 .58 1"
        values="
          0 316 48;
          -8 316 48;
          14 316 48;
          -10 316 48;
          10 316 48;
          -6 316 48;
          4 316 48;
          0 316 48"/>

      <!-- Phase 2: Gentle, subtle idle wave loop -->
      <animateTransform
        attributeName="transform"
        type="rotate"
        begin="intro-wave.end + 2s"
        dur="4.8s"
        repeatCount="indefinite"
        calcMode="spline"
        keyTimes="0; 0.12; 0.28; 0.44; 0.60; 1"
        keySplines="
          .42 0 .58 1;
          .42 0 .58 1;
          .42 0 .58 1;
          .42 0 .58 1;
          0 0 1 1"
        values="
          0 316 48;
          -3 316 48;
          5 316 48;
          -3 316 48;
          0 316 48;
          0 316 48"/>

      <text x="316" y="46" class="greeting hand">👋<set attributeName="visibility" to="hidden" begin="0s" dur=".480s"/></text>
    </g>

    <text x="346" y="46" class="greeting greeting-right" xml:space="preserve"><tspan>I<set attributeName="visibility" to="hidden" begin="0s" dur=".550s"/></tspan><tspan>'<set attributeName="visibility" to="hidden" begin="0s" dur=".585s"/></tspan><tspan>m<set attributeName="visibility" to="hidden" begin="0s" dur=".620s"/></tspan><tspan> <set attributeName="visibility" to="hidden" begin="0s" dur=".655s"/></tspan><tspan class="name"><tspan>M<set attributeName="visibility" to="hidden" begin="0s" dur=".780s"/><animate attributeName="rotate" values="-9;3;0" begin=".780s" dur=".45s"/></tspan><tspan>r<set attributeName="visibility" to="hidden" begin="0s" dur=".835s"/><animate attributeName="rotate" values="8;-3;0" begin=".835s" dur=".45s"/></tspan><tspan>K<set attributeName="visibility" to="hidden" begin="0s" dur=".890s"/><animate attributeName="rotate" values="-9;3;0" begin=".890s" dur=".45s"/></tspan><tspan>o<set attributeName="visibility" to="hidden" begin="0s" dur=".945s"/><animate attributeName="rotate" values="8;-3;0" begin=".945s" dur=".45s"/></tspan><tspan>b<set attributeName="visibility" to="hidden" begin="0s" dur="1.000s"/><animate attributeName="rotate" values="-9;3;0" begin="1.000s" dur=".45s"/></tspan><tspan>y<set attributeName="visibility" to="hidden" begin="0s" dur="1.055s"/><animate attributeName="rotate" values="8;-3;0" begin="1.055s" dur=".45s"/></tspan><tspan>0<set attributeName="visibility" to="hidden" begin="0s" dur="1.110s"/><animate attributeName="rotate" values="-9;3;0" begin="1.110s" dur=".45s"/></tspan><tspan>7<set attributeName="visibility" to="hidden" begin="0s" dur="1.165s"/><animate attributeName="rotate" values="8;-3;0" begin="1.165s" dur=".45s"/></tspan></tspan><tspan>!<set attributeName="visibility" to="hidden" begin="0s" dur="1.270s"/></tspan><tspan> <set attributeName="visibility" to="hidden" begin="0s" dur="1.305s"/></tspan><tspan>:<set attributeName="visibility" to="hidden" begin="0s" dur="1.340s"/></tspan><tspan>D<set attributeName="visibility" to="hidden" begin="0s" dur="1.375s"/></tspan></text>
  </g>

  <!-- Static Fallback -->
  <g class="static-heading" aria-hidden="true">
    <text x="286" y="46" class="greeting greeting-left">Ja Servus</text>
    <text x="316" y="46" class="greeting hand">👋</text>
    <text x="346" y="46" class="greeting greeting-right" xml:space="preserve">I'm <tspan class="name">MrKoby07</tspan>! :D</text>
  </g>

  <!-- Line and Comet elements -->
  <g aria-hidden="true">
    <use
      href="#separator-track"
      class="line line-glow"/>

    <use
      href="#separator-track"
      class="line line-front"/>

    <g mask="url(#track-mask)">
      <rect
        class="comet"
        x="-110"
        y="70"
        width="110"
        height="24"
        fill="url(#comet-color)"/>
    </g>

    <g transform="translate(360 94)">
      <path
        class="star"
        d="M0-6
           Q0 0 5 0
           Q0 0 0 6
           Q0 0-5 0
           Q0 0 0-6 Z"
        fill="#dc8add"/>
    </g>
  </g>
</svg>