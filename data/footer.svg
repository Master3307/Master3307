<svg xmlns="http://www.w3.org/2000/svg"
  width="720"
  height="96"
  viewBox="0 0 720 96"
  role="img"
  aria-labelledby="footer-title">

  <title id="footer-title">
    Feel free to explore some of my repositories. :3
  </title>

  <defs>
    <linearGradient
      id="separator-color"
      gradientUnits="userSpaceOnUse"
      x1="16" y1="0"
      x2="704" y2="0">
      <stop offset="0%" stop-color="#8e58d4" stop-opacity="0"/>
      <stop offset="8%" stop-color="#8e58d4" stop-opacity=".55"/>
      <stop offset="35%" stop-color="#a566ff" stop-opacity=".85"/>
      <stop offset="50%" stop-color="#dc8add"/>
      <stop offset="65%" stop-color="#a566ff" stop-opacity=".85"/>
      <stop offset="92%" stop-color="#8e58d4" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#8e58d4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient
      id="comet-color"
      gradientUnits="userSpaceOnUse"
      x1="-110" y1="0"
      x2="0" y2="0">
      <stop offset="0%" stop-color="#a566ff" stop-opacity="0"/>
      <stop offset="55%" stop-color="#a566ff" stop-opacity=".35"/>
      <stop offset="85%" stop-color="#dc8add" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#fff3ff"/>
    </linearGradient>

    <path
      id="separator-track"
      pathLength="1"
      d="M16 84 H312 L324 78 H348
         L360 84 L372 78 H396 L408 84 H704"/>

    <mask
      id="track-mask"
      maskUnits="userSpaceOnUse"
      x="12"
      y="70"
      width="696"
      height="24">
      <use
        href="#separator-track"
        fill="none"
        stroke="white"
        stroke-width="2"
        stroke-linecap="round"/>
    </mask>
  </defs>

  <style>
    .message {
      font-family: "Segoe UI", Ubuntu, Arial, sans-serif;
      font-size: 16px;
      font-weight: 400;
      fill: #8e58d4;
      text-anchor: middle;
      white-space: pre;
    }

    .line {
      fill: none;
      stroke: url(#separator-color);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1 1;
      animation: draw-line 1.2s cubic-bezier(.65, 0, .35, 1) .6s both;
    }

    .line-glow {
      stroke-width: 6;
      opacity: .08;
    }

    .line-front {
      stroke-width: 1.4;
    }

    .comet {
      opacity: 0;
      animation: sweep 6s linear 2.2s infinite;
    }

    .star {
      animation: star-arrive .65s cubic-bezier(.34, 1.56, .64, 1) 1.5s both;
    }

    @keyframes draw-line {
      from { stroke-dashoffset: 1; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes star-arrive {
      from {
        transform: scale(0) rotate(-45deg);
        opacity: 0;
      }
      to {
        transform: scale(1) rotate(0);
        opacity: .85;
      }
    }

    @keyframes sweep {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      8%, 76% {
        opacity: 1;
      }
      86%, 100% {
        transform: translateX(830px);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .message tspan {
        visibility: visible !important;
      }

      .line,
      .star {
        animation: none;
      }

      .line {
        stroke-dasharray: none;
      }

      .star {
        opacity: .85;
      }

      .comet {
        display: none;
        animation: none;
      }
    }
  </style>

  <!--
    Each character defaults to visible.
    A temporary SVG set hides it only until its typing time.
    Keep this text element on one line to avoid extra whitespace.
  -->
  <text x="360" y="30" class="message" xml:space="preserve"><tspan>F<set attributeName="visibility" to="hidden" begin="0s" dur=".100s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".135s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".170s"/></tspan><tspan>l<set attributeName="visibility" to="hidden" begin="0s" dur=".205s"/></tspan><tspan> <set attributeName="visibility" to="hidden" begin="0s" dur=".240s"/></tspan><tspan>f<set attributeName="visibility" to="hidden" begin="0s" dur=".275s"/></tspan><tspan>r<set attributeName="visibility" to="hidden" begin="0s" dur=".310s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".345s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".380s"/></tspan><tspan> <set attributeName="visibility" to="hidden" begin="0s" dur=".415s"/></tspan><tspan>t<set attributeName="visibility" to="hidden" begin="0s" dur=".450s"/></tspan><tspan>o<set attributeName="visibility" to="hidden" begin="0s" dur=".485s"/></tspan><tspan> <set attributeName="visibility" to="hidden" begin="0s" dur=".520s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".555s"/></tspan><tspan>x<set attributeName="visibility" to="hidden" begin="0s" dur=".590s"/></tspan><tspan>p<set attributeName="visibility" to="hidden" begin="0s" dur=".625s"/></tspan><tspan>l<set attributeName="visibility" to="hidden" begin="0s" dur=".660s"/></tspan><tspan>o<set attributeName="visibility" to="hidden" begin="0s" dur=".695s"/></tspan><tspan>r<set attributeName="visibility" to="hidden" begin="0s" dur=".730s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".765s"/></tspan><tspan> <set attributeName="visibility" to="hidden" begin="0s" dur=".800s"/></tspan><tspan>s<set attributeName="visibility" to="hidden" begin="0s" dur=".835s"/></tspan><tspan>o<set attributeName="visibility" to="hidden" begin="0s" dur=".870s"/></tspan><tspan>m<set attributeName="visibility" to="hidden" begin="0s" dur=".905s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".940s"/></tspan><tspan> <set attributeName="visibility" to="hidden" begin="0s" dur=".975s"/></tspan><tspan>o<set attributeName="visibility" to="hidden" begin="0s" dur="1.010s"/></tspan><tspan>f<set attributeName="visibility" to="hidden" begin="0s" dur="1.045s"/></tspan><tspan> <set attributeName="visibility" to="hidden" begin="0s" dur="1.080s"/></tspan><tspan>m<set attributeName="visibility" to="hidden" begin="0s" dur="1.115s"/></tspan><tspan>y<set attributeName="visibility" to="hidden" begin="0s" dur="1.150s"/></tspan><tspan> <set attributeName="visibility" to="hidden" begin="0s" dur="1.185s"/></tspan><tspan>r<set attributeName="visibility" to="hidden" begin="0s" dur="1.220s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur="1.255s"/></tspan><tspan>p<set attributeName="visibility" to="hidden" begin="0s" dur="1.290s"/></tspan><tspan>o<set attributeName="visibility" to="hidden" begin="0s" dur="1.325s"/></tspan><tspan>s<set attributeName="visibility" to="hidden" begin="0s" dur="1.360s"/></tspan><tspan>i<set attributeName="visibility" to="hidden" begin="0s" dur="1.395s"/></tspan><tspan>t<set attributeName="visibility" to="hidden" begin="0s" dur="1.430s"/></tspan><tspan>o<set attributeName="visibility" to="hidden" begin="0s" dur="1.465s"/></tspan><tspan>r<set attributeName="visibility" to="hidden" begin="0s" dur="1.500s"/></tspan><tspan>i<set attributeName="visibility" to="hidden" begin="0s" dur="1.535s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur="1.570s"/></tspan><tspan>s<set attributeName="visibility" to="hidden" begin="0s" dur="1.605s"/></tspan><tspan>.<set attributeName="visibility" to="hidden" begin="0s" dur="1.640s"/></tspan><tspan> <set attributeName="visibility" to="hidden" begin="0s" dur="1.675s"/></tspan><tspan>:<set attributeName="visibility" to="hidden" begin="0s" dur="1.710s"/></tspan><tspan>3<set attributeName="visibility" to="hidden" begin="0s" dur="1.745s"/></tspan></text>

  <g
    transform="translate(0 156) scale(1 -1)"
    aria-hidden="true">

    <use href="#separator-track" class="line line-glow"/>
    <use href="#separator-track" class="line line-front"/>

    <g mask="url(#track-mask)">
      <rect
        class="comet"
        x="-110"
        y="70"
        width="110"
        height="24"
        fill="url(#comet-color)"/>
    </g>

    <g transform="translate(360 94)">
      <path
        class="star"
        d="M0-6
           Q0 0 5 0
           Q0 0 0 6
           Q0 0-5 0
           Q0 0 0-6 Z"
        fill="#dc8add"/>
    </g>
  </g>
</svg>