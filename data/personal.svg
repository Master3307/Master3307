          pathLength="1"
          cx="14"
          cy="8"
          r="5"/>

        <path
          class="draw detail"
          pathLength="1"
          d="M4 26v-3a10 10 0 0 1 20 0v3"/>
      </g>
    </g>

    <text x="72" y="34" class="label" xml:space="preserve"><tspan>N<set attributeName="visibility" to="hidden" begin="0s" dur=".200s"/></tspan><tspan>a<set attributeName="visibility" to="hidden" begin="0s" dur=".235s"/></tspan><tspan>m<set attributeName="visibility" to="hidden" begin="0s" dur=".270s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".305s"/></tspan></text>

