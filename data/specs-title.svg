<svg xmlns="http://www.w3.org/2000/svg"
  width="132"
  height="28"
  viewBox="0 0 132 28"
  role="img"
  aria-labelledby="specs-heading-title">

  <title id="specs-heading-title">PC Specs</title>

  <style>
    .icon {
      fill: none;
      stroke: #dc8add;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon .draw {
      stroke-dasharray: 1;
      animation: draw-icon 1.1s cubic-bezier(.45, 0, .25, 1) both;
    }

    .icon .detail {
      animation-delay: .18s;
    }

    .icon-pulse {
      animation: breathe 6s ease-in-out 1.4s infinite;
    }

    .heading {
      fill: #dc8add;
      font-family: "Segoe UI", Ubuntu, Arial, sans-serif;
      font-size: 18px;
      font-weight: 400;
      white-space: pre;
    }

    @keyframes draw-icon {
      from {
        stroke-dashoffset: 1;
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      to {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @keyframes breathe {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: .65;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .heading tspan {
        visibility: visible !important;
      }

      .icon .draw,
      .icon-pulse {
        animation: none;
      }

      .icon .draw {
        stroke-dasharray: none;
      }
    }
  </style>

  <g class="icon" aria-hidden="true">
    <g class="icon-pulse">
      <rect
        class="draw"
        pathLength="1"
        x="2"
        y="4"
        width="24"
        height="16"
        rx="2"/>
      
      <path
        class="draw detail"
        pathLength="1"
        d="M2 16h24"/>

      <path
        class="draw detail"
        pathLength="1"
        d="M14 20v4 M8 25h12"/>
    </g>
  </g>

  <!-- Keep the text on one line to preserve natural spacing. -->
  <text x="36" y="20" class="heading" xml:space="preserve"><tspan>P<set attributeName="visibility" to="hidden" begin="0s" dur=".200s"/></tspan><tspan>C<set attributeName="visibility" to="hidden" begin="0s" dur=".235s"/></tspan><tspan> <set attributeName="visibility" to="hidden" begin="0s" dur=".270s"/></tspan><tspan>S<set attributeName="visibility" to="hidden" begin="0s" dur=".305s"/></tspan><tspan>p<set attributeName="visibility" to="hidden" begin="0s" dur=".340s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".375s"/></tspan><tspan>c<set attributeName="visibility" to="hidden" begin="0s" dur=".410s"/></tspan><tspan>s<set attributeName="visibility" to="hidden" begin="0s" dur=".445s"/></tspan></text>
</svg>