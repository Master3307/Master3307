<svg xmlns="http://www.w3.org/2000/svg"
  width="840"
  height="54"
  viewBox="0 0 840 54"
  role="img"
  aria-labelledby="home-link-title">

  <title id="home-link-title">HomeSite</title>

  <defs>
    <linearGradient id="divider-shimmer" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#8e58d4" stop-opacity="0"/>
      <stop offset="35%" stop-color="#8e58d4" stop-opacity=".12"/>
      <stop offset="65%" stop-color="#b879d8" stop-opacity=".3"/>
      <stop offset="85%" stop-color="#b879d8" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#8e58d4" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="divider-clip" clipPathUnits="userSpaceOnUse">
      <rect x="72" y="48" width="752" height="4"/>
    </clipPath>
  </defs>

  <style>
    text {
      font-family: "Segoe UI", Ubuntu, Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      fill: #8e58d4;
      white-space: pre;
    }

    .icon {
      fill: none;
      stroke: #dc8add;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .draw {
      stroke-dasharray: 1;
      animation: draw-icon 1.1s cubic-bezier(.45, 0, .25, 1) both;
    }

    .draw-link {
      animation-delay: .25s;
    }

    .icon-pulse {
      animation: breathe 6s ease-in-out 1.4s infinite;
    }

    .pulse-link {
      animation-delay: 1.65s;
    }

    .divider {
      fill: none;
      stroke: #8e58d4;
      stroke-opacity: .16;
      stroke-dasharray: 1;
      animation: draw-divider 1s cubic-bezier(.65, 0, .35, 1) .5s both;
    }

    .shimmer {
      fill: url(#divider-shimmer);
      animation: sweep 12s linear 1.8s infinite;
      opacity: 0;
    }

    @keyframes draw-icon {
      from {
        stroke-dashoffset: 1;
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      to {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @keyframes draw-divider {
      from { stroke-dashoffset: 1; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: .65; }
    }

    @keyframes sweep {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      12%, 76% {
        opacity: .4;
      }
      90%, 100% {
        transform: translateX(920px);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      text tspan {
        visibility: visible !important;
      }

      .draw,
      .icon-pulse,
      .divider {
        animation: none;
      }

      .draw,
      .divider {
        stroke-dasharray: none;
      }

      .shimmer {
        display: none;
        animation: none;
      }
    }
  </style>

  <g class="icon"
    transform="translate(26 12)"
    aria-hidden="true">
    <g class="icon-pulse">
      <path
        class="draw"
        pathLength="1"
        d="
          M2 13 14 3l12 10
          M5 11v15h18V11
          M11 26V16h6v10"/>
    </g>
  </g>

  <text x="72" y="31" xml:space="preserve"><tspan>H<set attributeName="visibility" to="hidden" begin="0s" dur=".200s"/></tspan><tspan>o<set attributeName="visibility" to="hidden" begin="0s" dur=".235s"/></tspan><tspan>m<set attributeName="visibility" to="hidden" begin="0s" dur=".270s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".305s"/></tspan><tspan>S<set attributeName="visibility" to="hidden" begin="0s" dur=".340s"/></tspan><tspan>i<set attributeName="visibility" to="hidden" begin="0s" dur=".375s"/></tspan><tspan>t<set attributeName="visibility" to="hidden" begin="0s" dur=".410s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".445s"/></tspan></text>

  <g class="icon"
    transform="translate(800 18)"
    aria-hidden="true">
    <g class="icon-pulse pulse-link">
      <path
        class="draw draw-link"
        pathLength="1"
        d="
          M8 2h10v10
          M18 2 7 13
          M5 5H2v16h16v-3"/>
    </g>
  </g>

  <path
    class="divider"
    pathLength="1"
    d="M72 50H824"/>

  <g clip-path="url(#divider-clip)" aria-hidden="true">
    <rect
      class="shimmer"
      x="-100"
      y="49.3"
      width="100"
      height="1.4"/>
  </g>
</svg>