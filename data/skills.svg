ibuteName="visibility" to="hidden" begin="0s" dur="1.225s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur="1.260s"/></tspan><tspan>r<set attributeName="visibility" to="hidden" begin="0s" dur="1.295s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur="1.330s"/></tspan><tspan>n<set attributeName="visibility" to="hidden" begin="0s" dur="1.365s"/></tspan><tspan>t<set attributeName="visibility" to="hidden" begin="0s" dur="1.400s"/></tspan><tspan> <set attributeName="visibility" to="hidden" begin="0s" dur="1.435s"/></tspan><tspan>t<set attributeName="visibility" to="hidden" begin="0s" dur="1.470s"/></tspan><tspan>o<set attributeName="visibility" to="hidden" begin="0s" dur="1.505s"/></tspan><tspan>p<set attributeName="visibility" to="hidden" begin="0s" dur="1.540s"/></tspan><tspan>i<set attributeName="visibility" to="hidden" begin="0s" dur="1.575s"/></tspan><tspan>c<set attributeName="visibility" to="hidden" begin="0s" dur="1.610s"/></tspan><tspan>s<set attributeName="visibility" to="hidden" begin="0s" dur="1.645s"/></tspan></text>

