<svg xmlns="http://www.w3.org/2000/svg"
  width="840"
  height="244"
  viewBox="0 0 840 244"
  role="img"
  aria-labelledby="skills-title skills-description">

  <title id="skills-title">Skills</title>

  <desc id="skills-description">
    Fast learner.
    Quickly understands different topics.
    Good at problem-solving.
    Creative thinker.
    Strong attention to detail.
  </desc>

  <defs>
    <linearGradient id="divider-shimmer" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#8e58d4" stop-opacity="0"/>
      <stop offset="35%" stop-color="#8e58d4" stop-opacity=".12"/>
      <stop offset="65%" stop-color="#b879d8" stop-opacity=".3"/>
      <stop offset="85%" stop-color="#b879d8" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#8e58d4" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="divider-clip" clipPathUnits="userSpaceOnUse">
      <rect x="72" y="56" width="752" height="4"/>
      <rect x="72" y="100" width="752" height="4"/>
      <rect x="72" y="144" width="752" height="4"/>
      <rect x="72" y="188" width="752" height="4"/>
    </clipPath>
  </defs>

  <style>
    text {
      font-family: "Segoe UI", Ubuntu, Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      fill: #8e58d4;
    }

    .icon {
      fill: none;
      stroke: #dc8add;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-pulse {
      animation: breathe 6s ease-in-out infinite;
    }

    .pulse-2 {
      animation-delay: -1.2s;
    }

    .pulse-3 {
      animation-delay: -2.4s;
    }

    .pulse-4 {
      animation-delay: -3.6s;
    }

    .pulse-5 {
      animation-delay: -4.8s;
    }

    .divider {
      fill: none;
      stroke: #8e58d4;
      stroke-opacity: .16;
    }

    .shimmer {
      fill: url(#divider-shimmer);
      animation: sweep 12s linear infinite;
      opacity: 0;
    }

    .shimmer-2 {
      animation-delay: -3s;
    }

    .shimmer-3 {
      animation-delay: -6s;
    }

    .shimmer-4 {
      animation-delay: -9s;
    }

    .content {
      animation: appear 1.3s ease-out both;
    }

    @keyframes appear {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes breathe {
      0%, 100% { opacity: .65; }
      50% { opacity: 1; }
    }

    @keyframes sweep {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      12% {
        opacity: .4;
      }
      76% {
        opacity: .4;
      }
      90%, 100% {
        transform: translateX(920px);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .content,
      .icon-pulse {
        animation: none;
      }

      .shimmer {
        display: none;
        animation: none;
      }
    }
  </style>

  <g class="content">
    <!-- Fast learner: lightning bolt -->
    <g class="icon"
      transform="translate(26 20)"
      aria-hidden="true">
      <g class="icon-pulse">
        <path d="M16 2 5 16h8l-1 10 11-15h-8Z"/>
      </g>
    </g>

    <text x="72" y="39">Fast learner</text>
    <path d="M72 58H824" class="divider"/>

    <!-- Understanding different topics: open book -->
    <g class="icon"
      transform="translate(26 64)"
      aria-hidden="true">
      <g class="icon-pulse pulse-2">
        <path d="
          M14 7
          C10 4 6 3 2 4
          v19
          c4-1 8 0 12 3
          c4-3 8-4 12-3
          V4
          c-4-1-8 0-12 3Z
          M14 7v19
          M6 9l4 1
          M6 14l4 1
          M18 10l4-1
          M18 15l4-1
        "/>
      </g>
    </g>

    <text x="72" y="83">Quickly understands different topics</text>
    <path d="M72 102H824" class="divider"/>

    <!-- Problem-solving: connected steps -->
    <g class="icon"
      transform="translate(26 108)"
      aria-hidden="true">
      <g class="icon-pulse pulse-3">
        <rect x="2" y="2" width="9" height="9" rx="2"/>
        <rect x="17" y="17" width="9" height="9" rx="2"/>
        <path d="
          M11 6h8a3 3 0 0 1 3 3v8
          M19 14l3 3 3-3
          M4 6l2 2 3-4
          M19 21l2 2 3-4
        "/>
      </g>
    </g>

    <text x="72" y="127">Good at problem-solving</text>
    <path d="M72 146H824" class="divider"/>

    <!-- Creative thinking: light bulb -->
    <g class="icon"
      transform="translate(26 152)"
      aria-hidden="true">
      <g class="icon-pulse pulse-4">
        <path d="
          M9 20
          c0-3-4-5-4-10
          a9 9 0 0 1 18 0
          c0 5-4 7-4 10
          Z
          M10 24h8
          M12 27h4
          M14 20v-7
          M10 10l4 3 4-3
        "/>
      </g>
    </g>

    <text x="72" y="171">Creative thinker</text>
    <path d="M72 190H824" class="divider"/>

    <!-- Attention to detail: magnifying glass -->
    <g class="icon"
      transform="translate(26 196)"
      aria-hidden="true">
      <g class="icon-pulse pulse-5">
        <circle cx="11" cy="11" r="8"/>
        <path d="
          M17 17l9 9
          M7 11l3 3 5-6
        "/>
      </g>
    </g>

    <text x="72" y="215">Strong attention to detail</text>

    <!-- Subtle moving highlights along the divider lines. -->
    <g clip-path="url(#divider-clip)" aria-hidden="true">
      <rect
        class="shimmer"
        x="-100"
        y="57.3"
        width="100"
        height="1.4"
      />

      <rect
        class="shimmer shimmer-2"
        x="-100"
        y="101.3"
        width="100"
        height="1.4"
      />

      <rect
        class="shimmer shimmer-3"
        x="-100"
        y="145.3"
        width="100"
        height="1.4"
      />

      <rect
        class="shimmer shimmer-4"
        x="-100"
        y="189.3"
        width="100"
        height="1.4"
      />
    </g>
  </g>
</svg>