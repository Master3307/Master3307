<svg xmlns="http://www.w3.org/2000/svg"
  width="100"
  height="28"
  viewBox="0 0 100 28"
  role="img"
  aria-labelledby="skills-heading-title">

  <title id="skills-heading-title">Skills</title>

  <style>
    .icon {
      fill: none;
      stroke: #a566ff;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon .draw {
      stroke-dasharray: 1;
      animation: draw-icon 1.1s cubic-bezier(.45, 0, .25, 1) both;
    }

    .icon .detail {
      animation-delay: .18s;
    }

    .icon-pulse {
      animation: breathe 6s ease-in-out 1.4s infinite;
    }

    .heading {
      fill: #a566ff;
      font-family: "Segoe UI", Ubuntu, Arial, sans-serif;
      font-size: 18px;
      font-weight: 400;
      white-space: pre;
    }

    @keyframes draw-icon {
      from {
        stroke-dashoffset: 1;
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      to {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @keyframes breathe {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: .65;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .heading tspan {
        visibility: visible !important;
      }

      .icon .draw,
      .icon-pulse {
        animation: none;
      }

      .icon .draw {
        stroke-dasharray: none;
      }
    }
  </style>

  <g class="icon" aria-hidden="true">
    <g class="icon-pulse">
      <path
        class="draw"
        pathLength="1"
        d="
          M14 6
          C12 1 6 2 6 7
          C1 7 1 14 4 16
          C1 21 6 27 11 24
          C13 26 14 23 14 21
          Z
        "/>

      <path
        class="draw"
        pathLength="1"
        d="
          M14 6
          C16 1 22 2 22 7
          C27 7 27 14 24 16
          C27 21 22 27 17 24
          C15 26 14 23 14 21
        "/>

      <path
        class="draw detail"
        pathLength="1"
        d="
          M6 7c0 3 2 4 4 4
          M4 16c3-2 6 0 6 3
          M22 7c0 3-2 4-4 4
          M24 16c-3-2-6 0-6 3
        "/>
    </g>
  </g>

  <!-- Keep the text on one line to preserve natural spacing. -->
  <text x="36" y="20" class="heading" xml:space="preserve"><tspan>S<set attributeName="visibility" to="hidden" begin="0s" dur=".200s"/></tspan><tspan>k<set attributeName="visibility" to="hidden" begin="0s" dur=".235s"/></tspan><tspan>i<set attributeName="visibility" to="hidden" begin="0s" dur=".270s"/></tspan><tspan>l<set attributeName="visibility" to="hidden" begin="0s" dur=".305s"/></tspan><tspan>l<set attributeName="visibility" to="hidden" begin="0s" dur=".340s"/></tspan><tspan>s<set attributeName="visibility" to="hidden" begin="0s" dur=".375s"/></tspan></text>
</svg>