            M9 7h10
            c3 0 5 2 6 5
            l2 8
            c.7 3-2.5 5-4.5 3
            L18 19h-8
            l-4.5 4
            c-2 2-5.2 0-4.5-3
            l2-8
            c1-3 3-5 6-5Z"/>
        <path
          class="draw detail"
          pathLength="1"
          d="M7 11v6 M4 14h6"/>
        <circle class="dot" cx="19" cy="12" r="1"/>
        <circle class="dot" cx="22" cy="15" r="1"/>
      </g>
