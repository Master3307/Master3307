    </g>

    <text x="72" y="215" xml:space="preserve"><tspan>E<set attributeName="visibility" to="hidden" begin="0s" dur="1.080s"/></tspan><tspan>x<set attributeName="visibility" to="hidden" begin="0s" dur="1.115s"/></tspan><tspan>p<set attributeName="visibility" to="hidden" begin="0s" dur="1.150s"/></tspan><tspan>l<set attributeName="visibility" to="hidden" begin="0s" dur="1.185s"/></tspan><tspan>o<set attributeName="visibility" to="hidden" begin="0s" dur="1.220s"/></tspan><tspan>r<set attributeName="visibility" to="hidden" begin="0s" dur="1.255s"/></tspan><tspan>i<set attributeName="visibility" to="hidden" begin="0s" dur="1.290s"/></tspan><tspan>n<set attributeName="visibility" to="hidden" begin="0s" dur="1.325s"/></tspan><tspan>g<set attributeName="visibility" to="hidden" begin="0s" dur="1.360s"/></tspan><tspan> <set attributeName="visibility" to="hidden" begin="0s" dur="1.395s"/></tspan><tspan>n<set attributeName="visibility" to="hidden" begin="0s" dur="1.430s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur="1.465s"/></tspan><tspan>w<set attributeName="visibility" to="hidden" begin="0s" dur="1.500s"/></tspan><tspan> <set attributeName="visibility" to="hidden" begin="0s" dur="1.535s"/></tspan><tspan>t<set attributeName="visibility" to="hidden" begin="0s" dur="1.570s"/></tspan><tspan>h<set attributeName="visibility" to="hidden" begin="0s" dur="1.605s"/></tspan><tspan>i<set attributeName="visibility" to="hidden" begin="0s" dur="1.640s"/></tspan><tspan>n<set attributeName="visibility" to="hidden" begin="0s" dur="1.675s"/></tspan><tspan>g<set attributeName="visibility" to="hidden" begin="0s" dur="1.710s"/></tspan><tspan>s<set attributeName="visibility" to="hidden" begin="0s" dur="1.745s"/></tspan></text>

    <path
