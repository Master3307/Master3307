<svg xmlns="http://www.w3.org/2000/svg"
  width="840"
  height="288"
  viewBox="0 0 840 288"
  role="img"
  aria-labelledby="interests-title interests-description">

  <title id="interests-title">Interests and hobbies</title>

  <desc id="interests-description">
    Gaming, modding, archiving, programming,
    exploring new things, and psychology.
  </desc>

  <defs>
    <linearGradient id="divider-shimmer" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#8e58d4" stop-opacity="0"/>
      <stop offset="35%" stop-color="#8e58d4" stop-opacity=".12"/>
      <stop offset="65%" stop-color="#b879d8" stop-opacity=".3"/>
      <stop offset="85%" stop-color="#b879d8" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#8e58d4" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="divider-clip" clipPathUnits="userSpaceOnUse">
      <rect x="72" y="56" width="752" height="4"/>
      <rect x="72" y="100" width="752" height="4"/>
      <rect x="72" y="144" width="752" height="4"/>
      <rect x="72" y="188" width="752" height="4"/>
      <rect x="72" y="232" width="752" height="4"/>
    </clipPath>
  </defs>

  <style>
    .row {
      --delay: 0s;
    }

    .row-2 { --delay: .22s; }
    .row-3 { --delay: .44s; }
    .row-4 { --delay: .66s; }
    .row-5 { --delay: .88s; }
    .row-6 { --delay: 1.1s; }

    text {
      font-family: "Segoe UI", Ubuntu, Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      fill: #8e58d4;
      white-space: pre;
    }

    .icon {
      fill: none;
      stroke: #dc8add;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon .draw {
      stroke-dasharray: 1;
      animation: draw-icon 1.1s cubic-bezier(.45, 0, .25, 1) both;
      animation-delay: var(--delay);
    }

    .icon .detail {
      animation-delay: calc(var(--delay) + .18s);
    }

    .icon .dot {
      fill: #dc8add;
      stroke: none;
      animation: reveal-dot .3s ease-out both;
      animation-delay: calc(var(--delay) + .8s);
    }

    .icon-pulse {
      animation: breathe 6s ease-in-out infinite;
      animation-delay: calc(var(--delay) + 1.4s);
    }

    .divider {
      fill: none;
      stroke: #8e58d4;
      stroke-opacity: .16;
      stroke-dasharray: 1;
      animation: draw-divider 1s cubic-bezier(.65, 0, .35, 1) both;
      animation-delay: calc(var(--delay) + .5s);
    }

    .shimmer {
      fill: url(#divider-shimmer);
      animation: sweep 12s linear infinite;
      animation-delay: 2.8s;
      opacity: 0;
    }

    .shimmer-2 { animation-delay: 5.2s; }
    .shimmer-3 { animation-delay: 7.6s; }
    .shimmer-4 { animation-delay: 10s; }
    .shimmer-5 { animation-delay: 12.4s; }

    @keyframes draw-icon {
      from {
        stroke-dashoffset: 1;
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      to {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @keyframes reveal-dot {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes draw-divider {
      from { stroke-dashoffset: 1; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: .65; }
    }

    @keyframes sweep {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      12%, 76% {
        opacity: .4;
      }
      90%, 100% {
        transform: translateX(920px);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      text tspan {
        visibility: visible !important;
      }

      .icon .draw,
      .icon .dot,
      .icon-pulse,
      .divider {
        animation: none;
      }

      .icon .draw,
      .divider {
        stroke-dasharray: none;
      }

      .shimmer {
        display: none;
        animation: none;
      }
    }
  </style>

  <!-- Gaming: controller -->
  <g class="row">
    <g class="icon"
      transform="translate(26 20)"
      aria-hidden="true">
      <g class="icon-pulse">
        <path
          class="draw"
          pathLength="1"
