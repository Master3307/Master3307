  </g>

  <!-- Subtle continuous shimmer after the entrance finishes. -->
  <g clip-path="url(#divider-clip)" aria-hidden="true">
    <rect
      class="shimmer"
      x="-100" y="57.3"
      width="100" height="1.4"/>

    <rect
      class="shimmer shimmer-2"
      x="-100" y="101.3"
      width="100" height="1.4"/>

    <rect
      class="shimmer shimmer-3"
      x="-100" y="145.3"
