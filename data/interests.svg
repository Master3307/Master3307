    <text x="72" y="171" xml:space="preserve"><tspan>P<set attributeName="visibility" to="hidden" begin="0s" dur=".860s"/></tspan><tspan>r<set attributeName="visibility" to="hidden" begin="0s" dur=".895s"/></tspan><tspan>o<set attributeName="visibility" to="hidden" begin="0s" dur=".930s"/></tspan><tspan>g<set attributeName="visibility" to="hidden" begin="0s" dur=".965s"/></tspan><tspan>r<set attributeName="visibility" to="hidden" begin="0s" dur="1.000s"/></tspan><tspan>a<set attributeName="visibility" to="hidden" begin="0s" dur="1.035s"/></tspan><tspan>m<set attributeName="visibility" to="hidden" begin="0s" dur="1.070s"/></tspan><tspan>m<set attributeName="visibility" to="hidden" begin="0s" dur="1.105s"/></tspan><tspan>i<set attributeName="visibility" to="hidden" begin="0s" dur="1.140s"/></tspan><tspan>n<set attributeName="visibility" to="hidden" begin="0s" dur="1.175s"/></tspan><tspan>g<set attributeName="visibility" to="hidden" begin="0s" dur="1.210s"/></tspan></text>

    <path
