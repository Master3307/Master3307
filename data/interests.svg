    <text x="72" y="39" xml:space="preserve"><tspan>G<set attributeName="visibility" to="hidden" begin="0s" dur=".200s"/></tspan><tspan>a<set attributeName="visibility" to="hidden" begin="0s" dur=".235s"/></tspan><tspan>m<set attributeName="visibility" to="hidden" begin="0s" dur=".270s"/></tspan><tspan>i<set attributeName="visibility" to="hidden" begin="0s" dur=".305s"/></tspan><tspan>n<set attributeName="visibility" to="hidden" begin="0s" dur=".340s"/></tspan><tspan>g<set attributeName="visibility" to="hidden" begin="0s" dur=".375s"/></tspan></text>

    <path
      class="divider"
      pathLength="1"
      d="M72 58H824"/>
  </g>

