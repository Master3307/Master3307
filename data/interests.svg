    <text x="72" y="127" xml:space="preserve"><tspan>A<set attributeName="visibility" to="hidden" begin="0s" dur=".640s"/></tspan><tspan>r<set attributeName="visibility" to="hidden" begin="0s" dur=".675s"/></tspan><tspan>c<set attributeName="visibility" to="hidden" begin="0s" dur=".710s"/></tspan><tspan>h<set attributeName="visibility" to="hidden" begin="0s" dur=".745s"/></tspan><tspan>i<set attributeName="visibility" to="hidden" begin="0s" dur=".780s"/></tspan><tspan>v<set attributeName="visibility" to="hidden" begin="0s" dur=".815s"/></tspan><tspan>i<set attributeName="visibility" to="hidden" begin="0s" dur=".850s"/></tspan><tspan>n<set attributeName="visibility" to="hidden" begin="0s" dur=".885s"/></tspan><tspan>g<set attributeName="visibility" to="hidden" begin="0s" dur=".920s"/></tspan></text>

    <path
