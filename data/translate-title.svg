<svg xmlns="http://www.w3.org/2000/svg"
  width="180"
  height="28"
  viewBox="0 0 180 28"
  role="img"
  aria-labelledby="translate-heading-title">

  <title id="translate-heading-title">Help Translate</title>

  <style>
    .icon {
      fill: none;
      stroke: #a566ff;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon .draw {
      stroke-dasharray: 1;
      animation: draw-icon 1.1s cubic-bezier(.45, 0, .25, 1) both;
    }

    .icon .detail {
      animation-delay: .18s;
    }

    .icon-pulse {
      animation: breathe 6s ease-in-out 1.4s infinite;
    }

    .heading {
      fill: #a566ff;
      font-family: "Segoe UI", Ubuntu, Arial, sans-serif;
      font-size: 18px;
      font-weight: 400;
      white-space: pre;
    }

    @keyframes draw-icon {
      from {
        stroke-dashoffset: 1;
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      to {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @keyframes breathe {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: .65;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .heading tspan {
        visibility: visible !important;
      }

      .icon .draw,
      .icon-pulse {
        animation: none;
      }

      .icon .draw {
        stroke-dasharray: none;
      }
    }
  </style>

  <g
    class="icon"
    transform="translate(2 2)"
    aria-hidden="true">

    <g class="icon-pulse">
      <circle
        class="draw"
        pathLength="1"
        cx="12"
        cy="12"
        r="11"/>

      <ellipse
        class="draw detail"
        pathLength="1"
        cx="12"
        cy="12"
        rx="4.5"
        ry="11"/>

      <path
        class="draw detail"
        pathLength="1"
        d="
          M1 12h22
          M3 6h18
          M3 18h18
        "/>
    </g>
  </g>

  <!-- Keep the text on one line to preserve natural spacing. -->
  <text x="36" y="20" class="heading" xml:space="preserve"><tspan>H<set attributeName="visibility" to="hidden" begin="0s" dur=".200s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".235s"/></tspan><tspan>l<set attributeName="visibility" to="hidden" begin="0s" dur=".270s"/></tspan><tspan>p<set attributeName="visibility" to="hidden" begin="0s" dur=".305s"/></tspan><tspan> <set attributeName="visibility" to="hidden" begin="0s" dur=".340s"/></tspan><tspan>T<set attributeName="visibility" to="hidden" begin="0s" dur=".375s"/></tspan><tspan>r<set attributeName="visibility" to="hidden" begin="0s" dur=".410s"/></tspan><tspan>a<set attributeName="visibility" to="hidden" begin="0s" dur=".445s"/></tspan><tspan>n<set attributeName="visibility" to="hidden" begin="0s" dur=".480s"/></tspan><tspan>s<set attributeName="visibility" to="hidden" begin="0s" dur=".515s"/></tspan><tspan>l<set attributeName="visibility" to="hidden" begin="0s" dur=".550s"/></tspan><tspan>a<set attributeName="visibility" to="hidden" begin="0s" dur=".585s"/></tspan><tspan>t<set attributeName="visibility" to="hidden" begin="0s" dur=".620s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".655s"/></tspan></text>
</svg>