<svg xmlns="http://www.w3.org/2000/svg"
  width="840"
  height="54"
  viewBox="0 0 840 54"
  role="img"
  aria-labelledby="youtube-link-title">

  <title id="youtube-link-title">YouTube</title>

  <defs>
    <linearGradient
      id="icon-shine"
      gradientUnits="userSpaceOnUse"
      x1="-28"
      y1="0"
      x2="0"
      y2="0"
      spreadMethod="pad">

      <stop offset="0%" stop-color="#a566ff"/>
      <stop offset="28%" stop-color="#a566ff"/>
      <stop offset="50%" stop-color="#bd8aff"/>
      <stop offset="72%" stop-color="#a566ff"/>
      <stop offset="100%" stop-color="#a566ff"/>

      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        values="0 0; 64 0; 64 0"
        keyTimes="0; 0.32; 1"
        begin="2.8s"
        dur="8s"
        repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    text {
      font-family: "Segoe UI", Ubuntu, Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      fill: #a566ff;
      white-space: pre;
    }

    .icon {
      fill: none;
      stroke: url(#icon-shine);
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .draw {
      stroke-dasharray: 1;
      animation: draw-icon 1.1s cubic-bezier(.45, 0, .25, 1) both;
    }

    .detail {
      animation-delay: .18s;
    }

    .draw-link {
      animation-delay: .25s;
    }

    .icon-pulse {
      animation: breathe 6s ease-in-out 1.4s infinite;
    }

    .pulse-link {
      animation-delay: 1.65s;
    }

    @keyframes draw-icon {
      from {
        stroke-dashoffset: 1;
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      to {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50% { opacity: .65; }
    }

    @media (prefers-reduced-motion: reduce) {
      text tspan {
        visibility: visible !important;
      }

      .icon {
        stroke: #a566ff;
      }

      .draw,
      .icon-pulse {
        animation: none;
      }

      .draw {
        stroke-dasharray: none;
      }
    }
  </style>

  <g class="icon"
    transform="translate(26 12)"
    aria-hidden="true">
    <g class="icon-pulse">
      <rect
        class="draw"
        pathLength="1"
        x="1"
        y="5"
        width="26"
        height="19"
        rx="5"/>

      <path
        class="draw detail"
        pathLength="1"
        d="M11 10l8 4.5-8 4.5Z"/>
    </g>
  </g>

  <text x="72" y="31" xml:space="preserve"><tspan>Y<set attributeName="visibility" to="hidden" begin="0s" dur=".200s"/></tspan><tspan>o<set attributeName="visibility" to="hidden" begin="0s" dur=".235s"/></tspan><tspan>u<set attributeName="visibility" to="hidden" begin="0s" dur=".270s"/></tspan><tspan>T<set attributeName="visibility" to="hidden" begin="0s" dur=".305s"/></tspan><tspan>u<set attributeName="visibility" to="hidden" begin="0s" dur=".340s"/></tspan><tspan>b<set attributeName="visibility" to="hidden" begin="0s" dur=".375s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".410s"/></tspan></text>

  <g class="icon"
    transform="translate(800 18)"
    aria-hidden="true">
    <g class="icon-pulse pulse-link">
      <path
        class="draw draw-link"
        pathLength="1"
        d="
          M8 2h10v10
          M18 2 7 13
          M5 5H2v16h16v-3"/>
    </g>
  </g>
</svg>