<svg xmlns="http://www.w3.org/2000/svg"
  width="280"
  height="54"
  viewBox="0 0 280 54"
  role="img"
  aria-labelledby="youtube-link-title">

  <title id="youtube-link-title">YouTube</title>

  <style>
    text {
      font-family: "Segoe UI", Ubuntu, Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      fill: #8e58d4;
    }

    .icon {
      fill: none;
      stroke: #dc8add;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .content {
      animation: appear 1.3s ease-out both;
    }

    @keyframes appear {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .content { animation: none; }
    }
  </style>

  <g class="content">
    <g class="icon"
      transform="translate(26 12)"
      aria-hidden="true">
      <rect x="1" y="5" width="26" height="19" rx="5"/>
      <path d="M11 10l8 4.5-8 4.5Z"/>
    </g>

    <text x="72" y="31">YouTube</text>

    <g class="icon"
      transform="translate(240 18)"
      aria-hidden="true">
      <path d="
        M8 2h10v10
        M18 2 7 13
        M5 5H2v16h16v-3
      "/>
    </g>
  </g>
</svg>