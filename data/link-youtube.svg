<svg xmlns="http://www.w3.org/2000/svg"
  width="840"
  height="54"
  viewBox="0 0 840 54"
  role="img"
  aria-labelledby="youtube-link-title">

  <title id="youtube-link-title">YouTube</title>

  <style>
    text {
      font-family: "Segoe UI", Ubuntu, Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      fill: #8e58d4;
    }

    .icon {
      fill: none;
      stroke: #dc8add;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-pulse {
      animation: breathe 6s ease-in-out infinite;
      animation-delay: -4s;
    }

    .pulse-link {
      animation-delay: -1s;
    }

    .content {
      animation: appear 1.3s ease-out both;
    }

    @keyframes appear {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes breathe {
      0%, 100% { opacity: .65; }
      50% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .content,
      .icon-pulse {
        animation: none;
      }
    }
  </style>

  <g class="content">
    <g class="icon"
      transform="translate(26 12)"
      aria-hidden="true">
      <g class="icon-pulse">
        <rect x="1" y="5" width="26" height="19" rx="5"/>
        <path d="M11 10l8 4.5-8 4.5Z"/>
      </g>
    </g>

    <text x="72" y="31">YouTube</text>

    <g class="icon"
      transform="translate(800 18)"
      aria-hidden="true">
      <g class="icon-pulse pulse-link">
        <path d="
          M8 2h10v10
          M18 2 7 13
          M5 5H2v16h16v-3
        "/>
      </g>
    </g>
  </g>
</svg>