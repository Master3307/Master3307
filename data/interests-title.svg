<svg xmlns="http://www.w3.org/2000/svg"
  width="220"
  height="28"
  viewBox="0 0 220 28"
  role="img"
  aria-labelledby="interests-heading-title">

  <title id="interests-heading-title">Interests / Hobbies</title>

  <style>
    .heading {
      font-family: "Segoe UI", Ubuntu, Arial, sans-serif;
      font-size: 18px;
      font-weight: 400;
      fill: #a566ff;
      white-space: pre;
    }

    .icon {
      fill: none;
      stroke: #a566ff;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .draw {
      stroke-dasharray: 1;
      animation: draw-icon 1.1s cubic-bezier(.45, 0, .25, 1) both;
    }

    .detail {
      animation-delay: .18s;
    }

    .dot {
      fill: #a566ff;
      stroke: none;
      animation: reveal-dot .3s ease-out .8s both;
    }

    @keyframes draw-icon {
      from {
        stroke-dashoffset: 1;
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      to {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @keyframes reveal-dot {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .heading tspan {
        visibility: visible !important;
      }

      .draw,
      .dot {
        animation: none;
      }

      .draw {
        stroke-dasharray: none;
      }
    }
  </style>

  <g class="icon" aria-hidden="true">
    <path
      class="draw"
      pathLength="1"
      d="
        M9 7h10
        c3 0 5 2 6 5
        l2 8
        c.7 3-2.5 5-4.5 3
        L18 19h-8
        l-4.5 4
        c-2 2-5.2 0-4.5-3
        l2-8
        c1-3 3-5 6-5Z"/>

    <path
      class="draw detail"
      pathLength="1"
      d="M7 11v6 M4 14h6"/>

    <circle class="dot" cx="19" cy="12" r="1"/>
    <circle class="dot" cx="22" cy="15" r="1"/>
  </g>

  <text x="36" y="20" class="heading" xml:space="preserve"><tspan>I<set attributeName="visibility" to="hidden" begin="0s" dur=".200s"/></tspan><tspan>n<set attributeName="visibility" to="hidden" begin="0s" dur=".235s"/></tspan><tspan>t<set attributeName="visibility" to="hidden" begin="0s" dur=".270s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".305s"/></tspan><tspan>r<set attributeName="visibility" to="hidden" begin="0s" dur=".340s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".375s"/></tspan><tspan>s<set attributeName="visibility" to="hidden" begin="0s" dur=".410s"/></tspan><tspan>t<set attributeName="visibility" to="hidden" begin="0s" dur=".445s"/></tspan><tspan>s<set attributeName="visibility" to="hidden" begin="0s" dur=".480s"/></tspan><tspan> <set attributeName="visibility" to="hidden" begin="0s" dur=".515s"/></tspan><tspan>/<set attributeName="visibility" to="hidden" begin="0s" dur=".550s"/></tspan><tspan> <set attributeName="visibility" to="hidden" begin="0s" dur=".585s"/></tspan><tspan>H<set attributeName="visibility" to="hidden" begin="0s" dur=".620s"/></tspan><tspan>o<set attributeName="visibility" to="hidden" begin="0s" dur=".655s"/></tspan><tspan>b<set attributeName="visibility" to="hidden" begin="0s" dur=".690s"/></tspan><tspan>b<set attributeName="visibility" to="hidden" begin="0s" dur=".725s"/></tspan><tspan>i<set attributeName="visibility" to="hidden" begin="0s" dur=".760s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".795s"/></tspan><tspan>s<set attributeName="visibility" to="hidden" begin="0s" dur=".830s"/></tspan></text>
</svg>