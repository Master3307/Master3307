<svg xmlns="http://www.w3.org/2000/svg"
  width="132"
  height="28"
  viewBox="0 0 132 28"
  role="img"
  aria-labelledby="personal-heading-title">

  <title id="personal-heading-title">Personal</title>

  <style>
    .heading {
      font-family: "Segoe UI", Ubuntu, Arial, sans-serif;
      font-size: 18px;
      font-weight: 400;
      fill: #dc8add;
      white-space: pre;
    }

    .icon {
      fill: none;
      stroke: #dc8add;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .draw {
      stroke-dasharray: 1;
      animation: draw-icon 1.1s cubic-bezier(.45, 0, .25, 1) both;
    }

    .detail {
      animation-delay: .18s;
    }

    @keyframes draw-icon {
      from {
        stroke-dashoffset: 1;
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      to {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .heading tspan {
        visibility: visible !important;
      }

      .draw {
        animation: none;
        stroke-dasharray: none;
      }
    }
  </style>

  <g class="icon" aria-hidden="true">
    <circle
      class="draw"
      pathLength="1"
      cx="14"
      cy="7"
      r="5"/>

    <path
      class="draw detail"
      pathLength="1"
      d="M4 25v-3a10 10 0 0 1 20 0v3"/>
  </g>

  <text x="36" y="20" class="heading" xml:space="preserve"><tspan>P<set attributeName="visibility" to="hidden" begin="0s" dur=".200s"/></tspan><tspan>e<set attributeName="visibility" to="hidden" begin="0s" dur=".235s"/></tspan><tspan>r<set attributeName="visibility" to="hidden" begin="0s" dur=".270s"/></tspan><tspan>s<set attributeName="visibility" to="hidden" begin="0s" dur=".305s"/></tspan><tspan>o<set attributeName="visibility" to="hidden" begin="0s" dur=".340s"/></tspan><tspan>n<set attributeName="visibility" to="hidden" begin="0s" dur=".375s"/></tspan><tspan>a<set attributeName="visibility" to="hidden" begin="0s" dur=".410s"/></tspan><tspan>l<set attributeName="visibility" to="hidden" begin="0s" dur=".445s"/></tspan></text>
</svg>