<svg xmlns="http://www.w3.org/2000/svg"
  width="840"
  height="54"
  viewBox="0 0 840 54"
  role="img"
  aria-labelledby="usercard-link-title">

  <title id="usercard-link-title">Usercard</title>

  <defs>
    <linearGradient id="divider-shimmer" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#8e58d4" stop-opacity="0"/>
      <stop offset="35%" stop-color="#8e58d4" stop-opacity=".12"/>
      <stop offset="65%" stop-color="#b879d8" stop-opacity=".3"/>
      <stop offset="85%" stop-color="#b879d8" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#8e58d4" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="divider-clip" clipPathUnits="userSpaceOnUse">
      <rect x="72" y="48" width="752" height="4"/>
    </clipPath>
  </defs>

  <style>
    text {
      font-family: "Segoe UI", Ubuntu, Arial, sans-serif;
      font-size: 14px;
      font-weight: 400;
      fill: #8e58d4;
    }

    .icon {
      fill: none;
      stroke: #dc8add;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-pulse {
      animation: breathe 6s ease-in-out infinite;
      animation-delay: -2s;
    }

    .pulse-link {
      animation-delay: -5s;
    }

    .divider {
      fill: none;
      stroke: #8e58d4;
      stroke-opacity: .16;
    }

    .shimmer {
      fill: url(#divider-shimmer);
      animation: sweep 12s linear infinite;
      animation-delay: -4s;
      opacity: 0;
    }

    .content {
      animation: appear 1.3s ease-out both;
    }

    @keyframes appear {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes breathe {
      0%, 100% { opacity: .65; }
      50% { opacity: 1; }
    }

    @keyframes sweep {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      12% {
        opacity: .4;
      }
      76% {
        opacity: .4;
      }
      90%, 100% {
        transform: translateX(920px);
        opacity: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .content,
      .icon-pulse {
        animation: none;
      }

      .shimmer {
        display: none;
        animation: none;
      }
    }
  </style>

  <g class="content">
    <g class="icon"
      transform="translate(26 12)"
      aria-hidden="true">
      <g class="icon-pulse">
        <rect x="1" y="4" width="26" height="21" rx="3"/>
        <circle cx="9" cy="11" r="3"/>
        <path d="
          M4 21v-1a5 5 0 0 1 10 0v1
          M18 10h5
          M18 15h5
          M18 20h3
        "/>
      </g>
    </g>

    <text x="72" y="31">Usercard</text>

    <g class="icon"
      transform="translate(800 18)"
      aria-hidden="true">
      <g class="icon-pulse pulse-link">
        <path d="
          M8 2h10v10
          M18 2 7 13
          M5 5H2v16h16v-3
        "/>
      </g>
    </g>

    <path d="M72 50H824" class="divider"/>

    <g clip-path="url(#divider-clip)" aria-hidden="true">
      <rect
        class="shimmer"
        x="-100"
        y="49.3"
        width="100"
        height="1.4"
      />
    </g>
  </g>
</svg>